name: Publish resume 26-09-0701

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-resume-26-09-0701.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          python -m pip install --upgrade pip
          pip install weasyprint==68.0
          fc-match "Noto Sans CJK SC"

      - name: Build ATS-friendly PDF
        run: |
          cat > /tmp/resume.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8" />
          <meta name="author" content="邱显煜" />
          <meta name="description" content="AI 应用开发工程师 / 全栈开发工程师" />
          <title>邱显煜 - 简历</title>
          <style>
          @page { size: A4; margin: 10.5mm 13mm 10mm 13mm; }
          * { box-sizing: border-box; }
          html, body { margin: 0; padding: 0; }
          body {
            font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
            font-size: 8.65pt;
            line-height: 1.31;
            color: #17202a;
            background: white;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
          }
          a { color: inherit; text-decoration: none; }
          .header { border-top: 4px solid #174a73; padding-top: 7px; margin-bottom: 7px; }
          .name-row { display: block; }
          .name { font-size: 23pt; font-weight: 800; letter-spacing: 0.8px; color: #123f63; line-height: 1.05; }
          .role { margin-top: 3px; font-size: 10.6pt; font-weight: 600; color: #2c6085; }
          .contact { margin-top: 4px; font-size: 8.0pt; color: #425466; word-spacing: 1px; }
          .section { margin-top: 7px; break-inside: avoid; }
          .section-title { font-size: 10.9pt; line-height: 1.1; font-weight: 800; color: #174a73; border-bottom: 1px solid #a9bfd0; padding-bottom: 2px; margin-bottom: 4px; }
          .item-head { font-size: 9.3pt; font-weight: 750; color: #111820; }
          .item-meta { font-size: 8.0pt; color: #53616e; margin-top: 1px; }
          .lead { margin: 3px 0 0 0; }
          .subhead { font-weight: 750; color: #205d88; margin-top: 4px; }
          .bullet { margin: 1.6px 0; padding-left: 10px; text-indent: -8px; }
          .skill-line { margin: 1.2px 0; }
          .skill-label { font-weight: 750; color: #1e567e; }
          .tech { margin-top: 2px; color: #40505d; }
          .award-line, .other-line { margin: 1.5px 0; }
          .compact { margin-top: 3px; }
          strong { font-weight: 750; }
          </style>
          </head>
          <body>
            <header class="header">
              <div class="name-row"><div class="name">邱显煜</div></div>
              <div class="role">AI 应用开发工程师 / 全栈开发工程师</div>
              <div class="contact">电话：13266338732　|　邮箱：3526547131@qq.com<br>个人网站：https://keidesu.top　|　GitHub：https://github.com/JackSmith111977</div>
            </header>

            <section class="section">
              <div class="section-title">教育经历</div>
              <div class="item-head">大连理工大学｜软件工程｜本科 · 前30%</div>
              <div class="item-meta">2023.09 - 2027.08</div>
            </section>

            <section class="section">
              <div class="section-title">技能</div>
              <div class="skill-line"><span class="skill-label">AI Engineering：</span>SDD / Spec Coding、Agent Workflow、Skill 开发、Context Engineering、Tool Use、AI 辅助 Code Review 与 Verification；熟悉 Claude Code、Codex、Pi 等 Coding Agent</div>
              <div class="skill-line"><span class="skill-label">编程语言：</span>TypeScript / JavaScript、Java；具备 Python 开发基础</div>
              <div class="skill-line"><span class="skill-label">前端开发：</span>Vue、React、Next.js、Taro；熟悉组件化开发、状态管理、复杂后台业务及前后端联调</div>
              <div class="skill-line"><span class="skill-label">后端开发：</span>Java、Node.js / Next.js Server；具备 REST API、异步任务、状态管理、文件处理及完整调用链开发经验</div>
              <div class="skill-line"><span class="skill-label">数据与存储：</span>PostgreSQL / Supabase、MongoDB；具备关系数据建模、查询、Migration 与数据链路开发经验</div>
              <div class="skill-line"><span class="skill-label">工程化与测试：</span>Git、GitHub Actions、Vitest、Playwright；具备自动化测试、CI 质量门禁及 Spec -> Implement -> Review -> Verify 研发实践</div>
            </section>

            <section class="section">
              <div class="section-title">实习经历</div>
              <div class="item-head">美团｜平台终端研发｜全栈开发实习生｜转正实习</div>
              <div class="item-meta">2026.05 - 至今</div>
              <p class="lead">负责财务系统合同预审相关需求的全栈研发，覆盖需求评审、技术方案设计与评审、前后端开发、联调上线及问题闭环，并在真实业务研发中实践 SDD、AI Coding 与 Agent Workflow 工程化。</p>

              <div class="subhead">合同预审二期｜SDD 驱动的 AI 增强研发</div>
              <div class="bullet">- <strong>SDD + AI 协同研发：</strong>独立负责合同预审二期需求全流程交付。接手陌生存量系统后，我先通过业务操作、代码链路与数据流建立系统认知，再将 PRD 与技术方案收敛为可执行 Spec，明确需求边界、影响范围与实现约束；由 AI/Agent 加速代码检索、调用链追踪、历史实现分析与开发执行，我负责业务理解、结论验证及最终技术决策，形成“人负责理解与决策、Spec 约束实现、AI 加速探索与执行”的研发模式。</div>
              <div class="bullet">- <strong>异步解析链路重构：</strong>定位大文件解析触发网关超时、但后端仍继续执行并完成落库导致前后端状态不一致的问题；将文件上传落库与解析任务解耦，改为异步事件执行并引入解析状态管理，使长耗时解析不再阻塞上传主流程，消除超时反馈与实际业务状态不一致。</div>
              <div class="bullet">- <strong>复杂文档解析增强：</strong>基于 Apache POI / HWPF 扩展 .doc 旧格式解析，解决控制字符乱码，并补充表格、删除线与修订内容识别；同步完善前端文件校验，提升复杂合同文档解析完整性与场景覆盖能力。</div>
              <div class="bullet">- <strong>合同审核全链路建设：</strong>完成 Excel / PDF / 图片多格式导出、双侧批注与批注区域拖拽/显隐、合同字段与检索条件、审核意见快捷输入等能力建设，覆盖前端展示、接口传输、Java 后端处理及数据库存储查询的完整链路。</div>

              <div class="subhead">AI 工程实践｜Workflow Skill</div>
              <div class="bullet">- <strong>Agent Workflow / Skill 工程化：</strong>将研发测试与验证中依赖个人经验的重复流程抽象为结构化 Workflow，统一前置条件、执行步骤、工具调用、检查点与结果反馈，并封装为 Agent 可复用 Skill；结合浏览器自动化与 CLI 工具实现按流程执行与验证，通过真实业务场景和团队反馈持续迭代，将隐性工程经验沉淀为可执行、可复用、可验证的 AI 能力。</div>
            </section>

            <section class="section">
              <div class="section-title">项目经历</div>
              <div class="item-head">LIMS｜实验室信息管理系统 · AI Engineering 实践</div>
              <div class="tech"><strong>技术栈：</strong>Next.js、TypeScript、Supabase / PostgreSQL、RLS、OpenAPI、Vitest、Playwright、GitHub Actions</div>
              <p class="lead">面向高校科研实验室构建实验室信息管理系统，覆盖实验任务、样品流转、实验数据、结果审核、报告归档及权限审计等核心业务，并以复杂全栈系统为载体实践 SDD 与 Agent Loop Engineering。</p>
              <div class="bullet">- <strong>SDD 驱动的 Agent 研发闭环：</strong>以 Spec 作为唯一事实源，建立 Spec -> Plan -> Tasks -> Implement -> Review -> Verify 研发流程，通过稳定需求 ID、Traceability Matrix、任务依赖与文件边界，将复杂需求拆解为可执行、可追踪的 Agent 工作单元，并约束多会话并行开发的依赖与修改范围。</div>
              <div class="bullet">- <strong>确定性验证与质量门禁：</strong>将 Agent 产出视为候选解，引入 Adversarial Review（对抗性审查）主动识别权限、状态、数据一致性及异常路径风险；结合单元/集成测试、Playwright E2E、Build、RLS 负向测试及自研 SDD 一致性检查，将工具反馈回流至 Agent，形成“执行—验证—修复—再验证”的闭环。</div>
              <div class="bullet">- <strong>复杂全栈业务建模：</strong>实现项目/任务、样品流转、实验数据处理、审核报告、人员权限、设备库存及审计追溯等模块；采用 Route Handler -> Service -> PostgreSQL 分层架构，结合状态机、RLS、Migration 与 OpenAPI 契约约束跨模块数据流与权限边界，保障业务一致性、可追溯性与可维护性。</div>
            </section>

            <section class="section compact">
              <div class="section-title">荣誉奖项</div>
              <div class="award-line">动感地带 AI+ 高校创新设计技术赛道 · 东北赛区三等奖｜2025</div>
              <div class="award-line">APMCM 亚太地区大学生数学建模竞赛 · 三等奖｜2023</div>
            </section>

            <section class="section compact">
              <div class="section-title">其他经历</div>
              <div class="other-line">腾讯广告大咖精英班（2025） · 字节跳动工程训练营-前端（2025） · 携程第五期前端训练营（2026）</div>
            </section>
          </body>
          </html>
          HTML

          weasyprint --pdf-variant=pdf/ua-1 /tmp/resume.html versions/resume-26-09-0701.pdf
          pdfinfo versions/resume-26-09-0701.pdf
          pdffonts versions/resume-26-09-0701.pdf
          pdftotext -layout versions/resume-26-09-0701.pdf /tmp/resume.txt

          python - <<'PY'
          from pathlib import Path
          import subprocess

          pdf = 'versions/resume-26-09-0701.pdf'
          text = Path('/tmp/resume.txt').read_text(encoding='utf-8')
          sections = ['教育经历', '技能', '实习经历', '项目经历', '荣誉奖项', '其他经历']
          positions = [text.find(s) for s in sections]
          assert all(p >= 0 for p in positions), positions
          assert positions == sorted(positions), positions
          for needle in ['邱显煜', '13266338732', '3526547131@qq.com', '东北赛区三等奖', 'LIMS｜实验室信息管理系统']:
              assert needle in text, needle
          info = subprocess.check_output(['pdfinfo', pdf], text=True)
          assert 'Pages:           1' in info
          assert 'A4' in info
          assert 'Tagged:          yes' in info
          fonts = subprocess.check_output(['pdffonts', pdf], text=True)
          font_lines = [line for line in fonts.splitlines()[2:] if line.strip()]
          assert font_lines
          assert all(' yes yes yes ' in f' {line} ' for line in font_lines), fonts
          PY

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/resume-26-09-0701.pdf
          if git diff --cached --quiet; then
            echo "PDF already up to date"
            exit 0
          fi
          git commit -m "resume: publish resume-26-09-0701 PDF"
          git push
