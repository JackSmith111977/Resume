name: Materialize Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - '.upload/resume-26-08-1505/ready'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct PDF
        shell: bash
        run: |
          cat \
            .upload/resume-26-08-1505/chunk-00 \
            .upload/resume-26-08-1505/chunk-01 \
            .upload/resume-26-08-1505/chunk-02 \
            .upload/resume-26-08-1505/chunk-03 \
            .upload/resume-26-08-1505/chunk-04 \
            .upload/resume-26-08-1505/chunk-05 \
            .upload/resume-26-08-1505/chunk-06 \
            .upload/resume-26-08-1505/chunk-07 \
            .upload/resume-26-08-1505/chunk-08 \
            .upload/resume-26-08-1505/chunk-09 \
            .upload/resume-26-08-1505/chunk-10 \
            .upload/resume-26-08-1505/chunk-11 \
            .upload/resume-26-08-1505/chunk-12 \
            .upload/resume-26-08-1505/chunk-13 \
            > /tmp/resume.b64
          base64 --decode /tmp/resume.b64 > versions/resume-26-08-1505.pdf
          echo "4894ac38fd6fe6aee7ccc5c96ca9195dcfa88f29c8055629d38eca66c9c080e2  versions/resume-26-08-1505.pdf" | sha256sum --check --strict
          test "$(stat -c%s versions/resume-26-08-1505.pdf)" -eq 98791

      - name: Commit release artifact
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .upload/resume-26-08-1505
          git add versions/resume-26-08-1505.pdf .upload/resume-26-08-1505
          git commit -m "resume: publish resume-26-08-1505 pdf"
          git push origin main
